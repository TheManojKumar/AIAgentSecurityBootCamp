services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006"]

  agent:
    build: .
    # Without this the service inherits the Dockerfile's CMD (check_env.py), which prints
    # its checks and exits — so nothing would ever listen on :8000 and every red-team run
    # would report connection refused. `docker compose run` still overrides it per command.
    command: python server.py
    ports: ["8000:8000"]      # HTTP endpoint the red-team tools hit
    environment:
      - ORCHESTRATOR_MODEL=${ORCHESTRATOR_MODEL:-qwen2.5:3b}
      - GUARD_MODEL=${GUARD_MODEL:-qwen2.5:3b}
      - EMBED_MODEL=${EMBED_MODEL:-all-minilm}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [phoenix]
    volumes:
      - ./:/lab
      - /var/run/docker.sock:/var/run/docker.sock
