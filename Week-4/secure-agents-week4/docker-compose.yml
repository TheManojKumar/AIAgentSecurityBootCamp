services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006"]

  agent:
    build: .
    environment:
      - ORCHESTRATOR_MODEL=${ORCHESTRATOR_MODEL:-qwen2.5:3b}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [phoenix]
    volumes:
      - ./:/lab
      # Docker-out-of-Docker: mount the host socket so the agent can spawn the
      # SIBLING sandbox container used by defenses/docker_sandbox.py.
      - /var/run/docker.sock:/var/run/docker.sock
